name: Build and deploy AQ-1 Azure dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'azure-dashboard/**'
      - '.github/workflows/main_aq1-coral-coast-dashboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Validate dashboard dependencies and Python files
        run: |
          python -m pip install --upgrade pip
          pip install -r azure-dashboard/requirements.txt
          python -m compileall azure-dashboard

      - name: Upload Azure dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: azure-dashboard/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_502E7DBAFACA4A07A7721B8FD6871043 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_78CA002F4ECE4B9EB39A77D5313271D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C0CD668C37804533919BF4082AACF188 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Aq1-coral-coast-dashboard'
          slot-name: 'Production'
          package: app
